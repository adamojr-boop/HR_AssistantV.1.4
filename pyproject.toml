[tool.poetry]
name = "hr-assistant"
version = "0.1.0"
description = "Assistente HR basato su RAG"
authors = ["Il tuo Nome <tuo.email@email.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
chainlit = "^2.3.0"
openai = "^1.0.0"
langchain = "^0.3.0"
langchain-openai = "^0.2.0"
langchain-text-splitters = "^0.3.0"
langchain-experimental = "^0.3.0"
python-dotenv = "^1.0.0"
pydantic = "^2.10.0"
chromadb = "^1.5.9"
markitdown = "0.1.7"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"